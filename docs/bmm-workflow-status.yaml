# Workflow Status Template

# This tracks progress through BMM methodology Analysis, Planning, and Solutioning phases.
# Implementation phase is tracked separately in sprint-status.yaml

# STATUS DEFINITIONS:
# ==================
# Initial Status (before completion):
#   - required: Must be completed to progress
#   - optional: Can be completed but not required
#   - recommended: Strongly suggested but not required
#   - conditional: Required only if certain conditions met (e.g., if_has_ui)
#
# Completion Status:
#   - {file-path}: File created/found (e.g., "docs/product-brief.md")
#   - skipped: Optional/conditional workflow that was skipped

generated: "2025-01-16"
project: "bmad-starter-kit"
project_type: "用户认证管理系统"
selected_track: "method"
field_type: "brownfield"
workflow_path: "method-brownfield.yaml"
workflow_status:
  # Prerequisite - Documentation
  - phase: "prerequisite"
    name: "Documentation"
    workflows:
      - id: "document-project"
        status: "docs/index.md"
        agent: "analyst"
        command: "document-project"
        output: "Comprehensive project documentation"
        purpose: "Understand existing codebase before planning"

  # Phase 0 - Discovery (Optional)
  - phase: "0"
    name: "Discovery (Optional)"
    workflows:
      - id: "brainstorm-project"
        status: "skipped"
        agent: "analyst"
        command: "brainstorm-project"
      - id: "research"
        status: "skipped"
        agent: "analyst"
        command: "research"
      - id: "product-brief"
        status: "skipped"
        agent: "analyst"
        command: "product-brief"

  # Phase 1 - Planning
  - phase: "1"
    name: "Planning"
    workflows:
      - id: "prd"
        status: "docs/planning-artifacts/prd.md"
        agent: "pm"
        command: "prd"
        output: "PRD focused on user authentication and admin dashboard"
        note: "Must consider existing system constraints"
      - id: "create-ux-design"
        status: "docs/planning-artifacts/ux-design-specification.md"
        condition: "if_has_ui"
        agent: "ux-designer"
        command: "create-ux-design"

  # Phase 2 - Solutioning
  - phase: "2"
    name: "Solutioning"
    workflows:
      - id: "create-architecture"
        status: "docs/planning-artifacts/architecture.md"
        agent: "architect"
        command: "create-architecture"
        output: "Integration architecture for auth and admin features"
        note: "HIGHLY RECOMMENDED: Distills brownfield context into focused solution design"
      - id: "create-epics-and-stories"
        status: "docs/planning-artifacts/epics.md"
        agent: "pm"
        command: "create-epics-and-stories"
        note: "Required: Break down PRD into implementable epics and stories with full context"
      - id: "test-design"
        status: "docs/test-design-epic-2.md"
        agent: "tea"
        command: "test-design"
        output: "Epic-level test design for Epic 2 (用户认证与账户管理)"
        note: "Epic 2 测试设计已完成: 114 场景, 63 小时 (~8 天)"
        epic: "2"
        completed: "2026-01-17"
      - id: "atdd"
        status: "docs/atdd-checklist-epic2-auth-api.md"
        agent: "tea"
        command: "atdd"
        output: "API integration tests for Epic 2 authentication endpoints"
        note: "Epic 2 API 集成测试已完成: 18 个测试用例，数据工厂，测试工具"
        epic: "2"
        completed: "2026-01-17"
      - id: "validate-architecture"
        status: "optional"
        agent: "architect"
        command: "validate-architecture"
      - id: "implementation-readiness"
        status: "complete"
        agent: "architect"
        command: "implementation-readiness"
        note: "Validates PRD + Architecture + Epics + UX"

  # Phase 3 - Implementation
  - phase: "3"
    name: "Implementation"
    workflows:
      - id: "sprint-planning"
        status: "docs/implementation-artifacts/sprint-status.yaml"
        agent: "sm"
        command: "sprint-planning"
        note: "Creates sprint plan with stories"
